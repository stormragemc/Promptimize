<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Promptimize synthetic UI fixture</title></head><body style="margin:0"><iframe title="Isolated Promptimize UI fixture" sandbox="allow-scripts allow-downloads" style="width:100%;height:100dvh;border:0"></iframe><script>(async()=>{let html="<!doctype html>\n<html lang=\"en\">\n<head><base href=\"" + location.origin + "\">\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <meta name=\"theme-color\" content=\"#f0eff2\">\n  <title>Promptimize — Refactor with evidence<\/title>\n  <link rel=\"stylesheet\" href=\"/styles.css\">\n<\/head>\n<body><div style=\"position:fixed;bottom:0;left:0;right:0;z-index:999;font:12px system-ui;background:#241a39;color:white;padding:6px;text-align:center\">Synthetic UI fixture · invented measurements for layout testing · no provider calls<\/div>\n  <div class=\"shell\">\n    <header class=\"topbar\"><a class=\"brand\" href=\"/\">Promptimize<span>✳<\/span><\/a><a class=\"top-action\" href=\"#workbench\">Open workbench <span aria-hidden=\"true\">↘<\/span><\/a><button id=\"help-guide\" class=\"help-guide\" aria-label=\"Open the Promptimize guide\" title=\"A little help\" aria-haspopup=\"dialog\"><\/button><\/header>\n    <main>\n      <section class=\"intro\">\n        <div class=\"intro-copy\"><h1 id=\"intro-title\" tabindex=\"-1\">Untangle the<br><span>promptbase.<\/span><\/h1><p>Find the rules. Cut the context. Prove the behavior.<\/p><button class=\"hero-button\" id=\"hero-start\">Explore the sample <span aria-hidden=\"true\">↗<\/span><\/button><\/div>\n        <div class=\"hero-art\" role=\"img\" aria-label=\"A tangled stack of prompt files becomes a small set of workflow modules\">\n          <div class=\"art-ring\"><\/div><div class=\"art-ring ring-two\"><\/div>\n          <div class=\"art-label from\">ALL FILES, EVERY TIME<\/div><div class=\"art-label to\">ONLY WHAT THIS TASK NEEDS<\/div>\n          <div class=\"file-card old-card old-one\"><span class=\"file-symbol\">↳<\/span><span>shared.md<\/span><i><\/i><i><\/i><i><\/i><\/div>\n          <div class=\"file-card old-card old-two\"><span class=\"file-symbol\">↳<\/span><span>refunds.md<\/span><i><\/i><i><\/i><\/div>\n          <div class=\"file-card old-card old-three\"><span class=\"file-symbol\">↳<\/span><span>cancellations.md<\/span><i><\/i><i><\/i><\/div>\n          <div class=\"file-card old-card old-four\"><span class=\"file-symbol\">↳<\/span><span>profile.md<\/span><i><\/i><i><\/i><\/div>\n          <div class=\"art-mark\" aria-hidden=\"true\">✳<\/div>\n          <div class=\"file-card new-card\"><div class=\"new-head\"><span class=\"new-symbol\">✳<\/span><span>Refund request<\/span><b>READY<\/b><\/div><div class=\"new-row\"><span class=\"dot violet\"><\/span>shared.md <span class=\"new-note\">always<\/span><\/div><div class=\"new-row\"><span class=\"dot pink\"><\/span>refund.md <span class=\"new-note\">selected<\/span><\/div><div class=\"new-foot\">2 modules loaded <span>→<\/span><\/div><\/div>\n        <\/div>\n      <\/section>\n      <nav class=\"steps\" id=\"workbench\" aria-label=\"Workflow\"><button class=\"step active\" data-step=\"input\">01 <span>Input<\/span><\/button><button class=\"step\" data-step=\"audit\">02 <span>Audit<\/span><\/button><button class=\"step\" data-step=\"proposal\">03 <span>Proposal<\/span><\/button><button class=\"step\" data-step=\"review\">04 <span>Review<\/span><\/button><button class=\"step\" data-step=\"candidate\">05 <span>Candidate<\/span><\/button><button class=\"step\" data-step=\"tests\">06 <span>Tests<\/span><\/button><button class=\"step\" data-step=\"finish\" disabled>07 <span>Downloads<\/span><\/button><\/nav>\n      <section id=\"input\" class=\"panel active\"><div class=\"panel-head\"><div><h2>Bring a promptbase<\/h2><p>Start with the synthetic event operations sample. For the UIC JD-viewer adapter, select _core.txt, _core_jd_request_context.txt and rules_m2_recruitment_viewer.txt. Other domains remain experimental.<\/p><\/div><span class=\"index\">01 / 07<\/span><\/div>\n        <div class=\"input-grid\"><div class=\"drop\"><input type=\"file\" id=\"folder\" webkitdirectory directory multiple accept=\".md,.txt,.json,.py,.js,.ts\"><label for=\"folder\"><strong>Choose a folder<\/strong><span>Text, Markdown, JSON and scripts · up to 12 files / 50 KB total<\/span><\/label><input type=\"file\" id=\"file-select\" multiple accept=\".md,.txt,.json,.py,.js,.ts\"><label class=\"file-pick\" for=\"file-select\">Choose specific files<\/label><\/div><button class=\"sample\" id=\"sample\"><span class=\"sample-icon\">✳<\/span><strong>Load the sample<\/strong><span>Refund, cancellation and profile workflows with a cross-workflow exception.<\/span><\/button><\/div>\n        <div id=\"file-list\" class=\"file-list\" aria-live=\"polite\"><\/div><div class=\"actions\"><span id=\"input-status\" class=\"hint\">No files selected<\/span><button class=\"primary\" id=\"analyze\" disabled>Analyze bundle <span>↗<\/span><\/button><\/div>\n      <\/section>\n      <section id=\"audit\" class=\"panel\"><div class=\"panel-head\"><div><h2>Review the rules<\/h2><p>Each extracted instruction links to its original file and exact wording. Check the interpretation before evaluating it.<\/p><\/div><span class=\"index\">02 / 07<\/span><\/div><div id=\"audit-summary\" class=\"summary\"><\/div><div id=\"rule-list\" class=\"rule-list\"><\/div><div class=\"actions\"><span class=\"hint\">Model suggestions need your review.<\/span><button id=\"approve\" class=\"primary\">View proposal <span>↗<\/span><\/button><\/div><\/section>\n      <section id=\"proposal\" class=\"panel\"><div class=\"panel-head\"><div><h2>Arrange the folder tree<\/h2><p>Rename proposed folders. Saved names become the actual paths in your exported promptbase.<\/p><\/div><span class=\"index\">03 / 07<\/span><\/div><div class=\"proposal-grid\"><article class=\"tree-card\"><div class=\"tree-card-head\"><h3>Before<\/h3><span id=\"before-count\"><\/span><\/div><div id=\"proposal-before\" class=\"folder-diagram\"><\/div><\/article><div class=\"tree-transfer\" aria-hidden=\"true\">→<\/div><article class=\"tree-card proposed\"><div class=\"tree-card-head\"><h3>Proposed<\/h3><span id=\"after-count\"><\/span><\/div><div id=\"proposal-after\" class=\"folder-diagram\"><\/div><\/article><\/div><div id=\"proposal-status\" class=\"status-note\" role=\"status\">Folder names can be edited directly in the proposed tree.<\/div><div class=\"actions\"><button id=\"save-tree\" class=\"secondary\">Save folder names<\/button><button id=\"to-review\" class=\"primary\">Review instructions <span>↗<\/span><\/button><\/div><\/section>\n      <section id=\"review\" class=\"panel\"><div class=\"panel-head\"><div><h2>Correct the proposal<\/h2><p>Adjust candidate instructions and where they belong. The original source remains available for comparison.<\/p><\/div><span class=\"index\">04 / 07<\/span><\/div><label class=\"filter-label\" for=\"review-filter\">Find a rule<\/label><input id=\"review-filter\" class=\"review-filter\" placeholder=\"Search by wording or rule ID\"><div id=\"correction-list\" class=\"correction-list\"><\/div><label class=\"filter-label\" for=\"review-notes\">Review notes<\/label><textarea id=\"review-notes\" class=\"review-notes\" rows=\"3\" placeholder=\"Explain a correction or record something to investigate\"><\/textarea><div id=\"review-status\" class=\"status-note\" role=\"status\">Save your corrections, then freeze the candidate.<\/div><div class=\"actions\"><button id=\"save-review\" class=\"secondary\">Save corrections<\/button><button id=\"freeze\" class=\"primary\" disabled>Approve &amp; freeze candidate <span>↗<\/span><\/button><\/div><\/section>\n      <section id=\"candidate\" class=\"panel\"><div class=\"panel-head\"><div><h2>What would load now<\/h2><p>The candidate preserves source wording and loads only the shared rules and the selected workflow.<\/p><\/div><span class=\"index\">05 / 07<\/span><\/div><div id=\"candidate-files\" class=\"folder-diagram final-tree\"><\/div><div id=\"candidate-warning\" class=\"warning\"><\/div><div class=\"bundle-panel\"><div><h3>Run this refactor<\/h3><p>Prepare the bundle, download it, then use the included Python runner.<\/p><\/div><button id=\"prepare-bundle\" class=\"primary ready-action\">Prepare runnable bundle <span>↗<\/span><\/button><div id=\"bundle-checks\" class=\"bundle-checks\" role=\"status\"><\/div><\/div><div class=\"actions\"><button id=\"new-proposal\" class=\"secondary\">Create next proposal<\/button><button id=\"export-zip\" class=\"secondary\">Download folder ZIP ↓<\/button><button id=\"export-md\" class=\"secondary\">Download promptbase.md ↓<\/button><button id=\"export\" class=\"secondary\">Download candidate JSON ↓<\/button><button id=\"go-tests\" class=\"primary\">Compare behavior <span>↗<\/span><\/button><\/div><\/section>\n      <section id=\"tests\" class=\"panel\"><div class=\"panel-head\"><div><h2>Same cases. Both versions.<\/h2><p>Run the reviewed cases for the selected adapter. A failure creates a next-iteration note; it never edits the frozen candidate.<\/p><\/div><span class=\"index\">06 / 07<\/span><\/div><div class=\"simulation-bar\"><div><strong>Watch the comparison<\/strong><span>Context → decision → simulated tool → resulting state<\/span><\/div><button id=\"live-view\" class=\"secondary\" disabled>Open visual comparison ↗<\/button><\/div><section class=\"evaluation-plan\" aria-labelledby=\"test-plan-heading\"><div class=\"evaluation-title\"><h3 id=\"test-plan-heading\">Review the test plan<\/h3><button id=\"build-test-plan\" class=\"secondary\">Build test plan<\/button><\/div><div id=\"test-plan-status\" class=\"hint\" role=\"status\">Build a plan from the original rules. This uses no model calls.<\/div><div id=\"test-plan-editor\" hidden><div class=\"evaluation-settings\"><label for=\"evaluation-repetitions\">Runs per case<select id=\"evaluation-repetitions\"><option value=\"1\">1 run<\/option><option value=\"2\">2 runs<\/option><option value=\"3\">3 runs<\/option><\/select><\/label><label for=\"evaluation-allowance\">Maximum reserved tokens<input id=\"evaluation-allowance\" type=\"number\" min=\"1000\" max=\"300000\" step=\"1000\" value=\"100000\"><\/label><\/div><div id=\"test-plan-cases\"><\/div><div class=\"actions\"><button id=\"add-test-case\" class=\"secondary\">Add a case<\/button><button id=\"edit-test-plan\" class=\"secondary\" disabled>Edit test plan<\/button><button id=\"approve-test-plan\" class=\"primary\">Approve selected cases<\/button><\/div><\/div><\/section><div id=\"case-list\" class=\"case-list\"><\/div><div id=\"budget\" class=\"summary\" style=\"margin-top:18px\"><\/div><div class=\"actions\"><button id=\"preflight\" class=\"secondary\">Check token budget<\/button><span class=\"hint\">Sample or JD-viewer adapter · check the allowance before running.<\/span><button id=\"run-tests\" class=\"primary\" disabled>Run comparisons <span>↗<\/span><\/button><\/div><div id=\"results\" class=\"results\" aria-live=\"polite\"><\/div><\/section>\n      <section id=\"finish\" class=\"panel finish-panel\" aria-labelledby=\"finish-title\"><div id=\"finish-mark\" class=\"finish-mark\" aria-hidden=\"true\"><svg viewBox=\"0 0 64 64\" fill=\"none\"><path d=\"M18 33l9 9 20-23\" stroke=\"currentColor\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/div><h2 id=\"finish-title\" tabindex=\"-1\">Here you go!<\/h2><p id=\"finish-status\" role=\"status\"><\/p><p id=\"finish-summary\" class=\"hint\"><\/p><div id=\"finish-metrics\" class=\"finish-metrics\" aria-label=\"Measured changes on reviewed cases\"><\/div><div class=\"finish-downloads\"><div><div><h3>Workflow folders<\/h3><p>Prompts, intents, the Python runner and test evidence.<\/p><\/div><button id=\"finish-zip\" class=\"primary\">Download folder ZIP ↓<\/button><\/div><div><div><h3>One Markdown file<\/h3><p>Your candidate instructions and source map.<\/p><\/div><button id=\"finish-md\" class=\"secondary\">Download Markdown ↓<\/button><\/div><div><div><h3>Candidate registry<\/h3><p>The proposal, test results and iteration history.<\/p><\/div><button id=\"finish-json\" class=\"secondary\">Download candidate JSON ↓<\/button><\/div><div><div><h3>Test evidence<\/h3><p>Reviewed scenarios, call receipts and measurements.<\/p><\/div><button id=\"finish-evidence\" class=\"secondary\">Download test report ↓<\/button><\/div><\/div><div class=\"actions\"><button id=\"finish-back\" class=\"secondary\">Back to results<\/button><button id=\"finish-another\" class=\"primary\">Upload another promptbase <span aria-hidden=\"true\">↗<\/span><\/button><\/div><\/section>\n    <\/main>\n    <footer>Built for reviewable promptbase refactors <span>·<\/span> Model comparisons send the selected context to Meta · Original scripts are never executed<\/footer>\n  <\/div>\n  <dialog id=\"simulation-dialog\" class=\"simulation-dialog\" aria-labelledby=\"simulation-title\"><div class=\"sim-toolbar\"><div><h2 id=\"simulation-title\">Behavior comparison<\/h2><p>Recorded model output + deterministic tool fixtures · playback uses no model calls<\/p><\/div><button id=\"close-simulation\" class=\"icon-button\" aria-label=\"Close visual comparison\">×<\/button><\/div><div id=\"trace-success\" class=\"trace-success\" role=\"status\" aria-live=\"polite\" hidden><span class=\"trace-success-mark\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"m5 12 4 4L19 6\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/span><div><strong>Hooray! Same final state.<\/strong><p>Both versions passed this scenario’s checks.<\/p><\/div><button id=\"dismiss-trace-success\" class=\"icon-button\" aria-label=\"Dismiss matching-state celebration\">×<\/button><\/div><div class=\"sim-controls\"><label for=\"simulation-case\">Scenario<\/label><select id=\"simulation-case\"><\/select><div class=\"playback-controls\"><button id=\"sim-prev\" class=\"secondary\">← Step back<\/button><button id=\"sim-play\" class=\"primary\">Play trace<\/button><button id=\"sim-next\" class=\"secondary\">Step forward →<\/button><button id=\"sim-final\" class=\"secondary\">Show final state<\/button><\/div><\/div><p id=\"simulation-query\" class=\"sim-query\"><\/p><div id=\"simulation-stage\" class=\"sim-stage\" role=\"status\"><\/div><div id=\"simulation-evidence\" class=\"simulation-evidence\"><\/div><div id=\"simulation-columns\" class=\"simulation-columns\"><\/div><div id=\"simulation-diff\" class=\"simulation-diff\"><\/div><div class=\"sim-footnote\">The model chooses an intent/action. The adapter dispatches deterministic simulated tools; no production systems are changed. The display shows actions and evidence, not private model reasoning.<\/div><\/dialog>\n  <dialog id=\"budget-warning-dialog\" class=\"budget-warning-dialog\" aria-labelledby=\"budget-warning-title\" aria-describedby=\"budget-warning-message\"><div class=\"budget-warning-head\"><h2 id=\"budget-warning-title\">More tokens needed<\/h2><button id=\"close-budget-warning\" class=\"icon-button\" aria-label=\"Close token allowance warning\">×<\/button><\/div><p id=\"budget-warning-message\"><\/p><dl class=\"budget-warning-numbers\"><div><dt>Required reserve<\/dt><dd id=\"budget-required\"><\/dd><\/div><div><dt>Allocated<\/dt><dd id=\"budget-allocated\"><\/dd><\/div><div><dt id=\"budget-difference-label\">Shortfall<\/dt><dd id=\"budget-difference\"><\/dd><\/div><\/dl><p id=\"budget-warning-advice\" class=\"hint\"><\/p><div class=\"actions\"><button id=\"budget-keep-allowance\" class=\"secondary\">Use current allowance<\/button><button id=\"budget-edit-plan\" class=\"primary\" autofocus>Edit cases and allowance<\/button><\/div><\/dialog>\n  <aside id=\"activity\" class=\"activity\" role=\"status\" aria-live=\"polite\" hidden>\n    <div id=\"activity-flight\" class=\"activity-flight\" aria-hidden=\"true\"><svg viewBox=\"0 0 240 120\" fill=\"none\"><defs><linearGradient id=\"flight-color\" x1=\"10\" y1=\"100\" x2=\"230\" y2=\"10\" gradientUnits=\"userSpaceOnUse\"><stop stop-color=\"#ec74ce\"/><stop offset=\".65\" stop-color=\"#533ff6\"/><stop offset=\"1\" stop-color=\"#f0eff2\"/><\/linearGradient><\/defs><path class=\"flight-trail\" d=\"M20 82C55 100 98 97 136 67S194 25 221 42C251 62 172 108 145 71S139 20 177 20\" stroke=\"url(#flight-color)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"3 7\"/><g class=\"flight-plane\"><path d=\"m-18-3 34-12-10 32-8-14-16-6Z\" fill=\"url(#flight-color)\" stroke=\"#533ff6\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><path d=\"M-2 3 16-15M-2 3l-1 12 9-8\" stroke=\"#f0eff2\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><\/g><\/svg><\/div>\n    <div class=\"activity-copy\"><strong id=\"activity-title\"><\/strong><p id=\"activity-detail\"><\/p><small id=\"activity-tip\"><\/small><div class=\"activity-receipt\"><span id=\"activity-context\"><\/span><span id=\"activity-time\" aria-hidden=\"true\"><\/span><\/div><\/div>\n  <\/aside>\n  <dialog id=\"guide-dialog\" class=\"guide-dialog\" aria-labelledby=\"guide-title\" aria-describedby=\"guide-body guide-note\">\n    <div id=\"guide-spotlight\" class=\"guide-spotlight\" aria-hidden=\"true\" hidden><\/div>\n    <div class=\"guide-card\"><div class=\"guide-top\"><span id=\"guide-progress\"><\/span><button id=\"guide-close\" class=\"icon-button\" aria-label=\"Close tutorial\">×<\/button><\/div>\n      <div class=\"guide-content\"><h2 id=\"guide-title\" tabindex=\"-1\"><\/h2><p id=\"guide-body\"><\/p><div id=\"guide-demo\" class=\"guide-demo\" aria-hidden=\"true\"><\/div><p id=\"guide-availability\" class=\"guide-availability\"><\/p><p id=\"guide-note\" class=\"guide-note\"><\/p>\n      <button id=\"guide-take-me\" class=\"guide-link\" hidden>Show this step in my workbench<\/button><\/div>\n      <div class=\"guide-controls\"><button id=\"guide-back\" class=\"secondary\">Back<\/button><button id=\"guide-next\" class=\"primary\">Next<\/button><\/div>\n      <div class=\"guide-bottom\"><button id=\"guide-skip\" class=\"guide-link\">Skip tutorial<\/button><label><input id=\"guide-hints\" type=\"checkbox\" checked>Next-step hints<\/label><\/div>\n    <\/div>\n  <\/dialog>\n  <aside id=\"next-hint\" class=\"next-hint\" role=\"status\" aria-live=\"polite\" hidden><svg id=\"hint-pointer\" class=\"hint-pointer\" viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M12 3v17m-6-6 6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><span id=\"hint-text\"><\/span><button id=\"hint-show\" class=\"guide-link\" hidden>Show me<\/button><button id=\"hint-dismiss\" class=\"icon-button\" aria-label=\"Dismiss next-step hint\">×<\/button><\/aside>\n  <script>Object.defineProperty(window,'sessionStorage',{value:{getItem:()=>\"{\\\"analysis\\\":{\\\"rules\\\":[{\\\"id\\\":\\\"R1\\\",\\\"file\\\":\\\"shared.md\\\",\\\"line\\\":1,\\\"quote\\\":\\\"All answers must use the allowed actions only. Never invent a booking ID or event status. Ask for missing identifiers before acting. Never change a reservation without the account owner confirming the specific action.\\\",\\\"workflows\\\":[\\\"shared\\\"]},{\\\"id\\\":\\\"R2\\\",\\\"file\\\":\\\"refunds.md\\\",\\\"line\\\":1,\\\"quote\\\":\\\"For a customer-requested refund, purchases made 14 days ago or less are eligible. Purchases older than 14 days are ineligible. If the event was cancelled by the organizer, the customer is eligible regardless of purchase age. When cancellation status is unknown, look up the event status before deciding. If the event ID is missing, ask for it first. If the lookup fails, escalate rather than inventing a status.\\\",\\\"workflows\\\":[\\\"refund\\\"]},{\\\"id\\\":\\\"R3\\\",\\\"file\\\":\\\"cancellations.md\\\",\\\"line\\\":1,\\\"quote\\\":\\\"A cancellation reque
